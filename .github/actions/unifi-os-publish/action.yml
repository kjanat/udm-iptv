---
name: Publish UniFi OS firmware images
description: Push tested firmware images and their stable aliases to GHCR
inputs:
  image:
    description: Container image repository
    required: true
  model:
    description: Device model used in image tags
    required: true
  firmwares:
    description: JSON array containing the tested firmware pair
    required: true
  latest:
    description: Also point the repository-wide latest tag at this model
    required: false
    default: "false"
  token:
    description: GitHub token used to access the container registry
    required: true
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        UNIFI_OS_IMAGE: ${{ inputs.image }}
        MODEL: ${{ inputs.model }}
        UNIFI_OS_FIRMWARES: ${{ inputs.firmwares }}
        PUBLISH_LATEST: ${{ inputs.latest }}
      run: '"${GITHUB_ACTION_PATH}/publish.bash"'
