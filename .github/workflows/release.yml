name: Release
on: { push: { tags: ["v*"] } }
env: { UDM_IPTV_SENTRY_DSN: "${{ vars.SENTRY_DSN }}", GORELEASER: "v2.18.1" }
jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - name: Test Go
        run: go test ./...
      - name: Check Go vulnerabilities
        run: go tool govulncheck ./...
      - name: Build Release Assets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER }}
          args: release --clean --skip=publish
      - name: Materialize Binary Release Asset
        run: install -m 0755 dist/udm-iptv_linux_arm64_v8.0/udm-iptv dist/udm-iptv-linux-arm64
      - name: Attest Packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: &Artefacts |
            dist/udm-iptv-linux-arm64
            dist/*.deb
            dist/SHA256SUMS
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: &ArtefactsName build-artifacts
          if-no-files-found: error
          path: *Artefacts

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - name: Download Attested Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: *ArtefactsName, path: dist }
      - name: Publish Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${GITHUB_REF#"refs/tags/"}"
          assets=(dist/udm-iptv-linux-arm64 dist/*.deb dist/SHA256SUMS)
          for asset in "${assets[@]}"; do test -f "${asset}"; done

          state=$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null || true)
          case "${state}" in
            "") gh release create "${tag}" --draft --generate-notes --title "udm-iptv ${tag}" --verify-tag ;;
            true) ;;
            false)
              echo "Release ${tag} is already published."
              exit 0
              ;;
            *)
              echo "Unexpected release state: ${state}" >&2
              exit 1
              ;;
          esac
          gh release upload "${tag}" "${assets[@]}" --clobber
          gh release edit "${tag}" --draft=false
