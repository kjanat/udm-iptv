---
name: UniFi OS
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sku:
        description: Firmware sku to build and publish
        required: true
        default: udmpro
        type: choice
        options: [udm, udmpro, udmse, udmpromax, udmbeast, all]

permissions: { contents: read, packages: read }

jobs:
  build-deb:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: udm-iptv } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: udm-iptv }
      - run: sudo apt-get update && sudo apt-get install -y devscripts debhelper build-essential
      - run: debuild -uc -us --lintian-opts --profile debian
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: build-artifacts, if-no-files-found: error, path: "*.deb" }

  catalog:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.result }}
      models: ${{ steps.models.outputs.result }}
      pairs: ${{ steps.pairs.outputs.result }}
    env:
      SKU: ${{ github.event_name == 'workflow_dispatch' && inputs.sku || 'all' }}
      UNIFI_OS_IMAGE: ghcr.io/kjanat/unifi-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: column --table-columns=model,id,ver,url --json < docker/unifi-os/firmware.tsv > docker/unifi-os/firmware.json
      - id: rows
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: yq -I=0 '.table' docker/unifi-os/firmware.json
      - id: models
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        env: { SKU: "${{ env.SKU }}" }
        with:
          cmd: yq -I=0 '[.table[].model] | unique | map(select(strenv(SKU) == "all" or strenv(SKU) == "" or . == strenv(SKU)))' docker/unifi-os/firmware.json
      - id: pairs
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        env: { SKU: "${{ env.SKU }}", UNIFI_OS_IMAGE: "${{ env.UNIFI_OS_IMAGE }}" }
        with:
          cmd: |
            yq -I=0 '.table | map(select(strenv(SKU) == "all" or strenv(SKU) == "" or .model == strenv(SKU))) | group_by(.model) | map(sort_by(.ver | split(".") | map(tonumber))) | map({"model": .[0].model, "from_image": (strenv(UNIFI_OS_IMAGE) + ":" + .[-2].model + "-" + .[-2].ver), "to_image": (strenv(UNIFI_OS_IMAGE) + ":" + .[-1].model + "-" + .[-1].ver)})' docker/unifi-os/firmware.json

  test-install:
    needs: [build-deb, catalog]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: build-artifacts, path: build-artifacts }
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with: { platforms: arm64 }
      - run: docker/unifi-os/build.sh "${MODEL}"
        env:
          MODEL: ${{ matrix.model }}
          UNIFI_OS_CACHE: ${{ runner.temp }}/unifi-os
          UNIFI_OS_IMAGE: ghcr.io/kjanat/unifi-os
      - run: |
          set -- build-artifacts/udm-iptv_*.deb
          docker/unifi-os/test-install.sh "${MODEL}" "$1"
        env:
          FROM_IMAGE: ${{ matrix.from_image }}
          TO_IMAGE: ${{ matrix.to_image }}
          MODEL: ${{ matrix.model }}
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - if: github.event_name == 'workflow_dispatch'
        run: docker/unifi-os/publish.sh "${MODEL}"
        env: { MODEL: ${{ matrix.model }} }
