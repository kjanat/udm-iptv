---
name: UniFi OS
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sku:
        description: Firmware sku to build and publish
        required: true
        default: udmpro
        type: choice
        options: [udm, udmpro, udmse, udmpromax, udmbeast, all]

concurrency:
  group: unifi-os-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions: { contents: read, packages: read }

env:
  SKU: ${{ case(github.event_name == 'workflow_dispatch', inputs.sku, 'all') }}
  UNIFI_OS_IMAGE: "ghcr.io/${{ github.repository_owner }}/unifi-os"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: udm-iptv } }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { path: udm-iptv }
      - run: sudo apt-get update && sudo apt-get install -y devscripts debhelper build-essential
      - run: debuild -uc -us --lintian-opts --profile debian
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: build-artifacts, if-no-files-found: error, path: "*.deb" }

  catalog:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.result }}
      models: ${{ steps.models.outputs.result }}
      pairs: ${{ steps.pairs.outputs.result }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: column --table-columns=model,id,ver,url --json < docker/unifi-os/firmware.tsv > docker/unifi-os/firmware.json
      - id: rows
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with: { cmd: "yq -I=0 '.table' docker/unifi-os/firmware.json" }
      - id: models
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: >-
            yq -I=0 '
              [.table[].model] | unique |
                map(select(
                  strenv(SKU) == "all" or
                  strenv(SKU) == "" or
                  . == strenv(SKU)
                ))
            ' docker/unifi-os/firmware.json
      - id: pairs
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4
        with:
          cmd: >-
            yq -I=0 '
              .table
                | map(select(strenv(SKU) == "all" or strenv(SKU) == "" or .model == strenv(SKU)))
                | group_by(.model)
                | map(sort_by(.ver | split(".") | map(tonumber)))
                | map({"model": .[0].model, "from_image": (strenv(UNIFI_OS_IMAGE) + ":" + .[-2].model + "-" + .[-2].ver), "to_image": (strenv(UNIFI_OS_IMAGE) + ":" + .[-1].model + "-" + .[-1].ver)})
            ' docker/unifi-os/firmware.json

  test-install:
    needs: [build-deb, catalog]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    defaults: { run: { working-directory: docker/unifi-os } }
    strategy: { fail-fast: false, matrix: { include: "${{ fromJSON(needs.catalog.outputs.pairs) }}" } }
    env: { MODEL: "${{ matrix.model }}", FROM_IMAGE: "${{ matrix.from_image }}", TO_IMAGE: "${{ matrix.to_image }}" }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: build-artifacts, path: docker/unifi-os }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - parallel:
          - name: Pull previous firmware image
            continue-on-error: true
            run: docker pull "${FROM_IMAGE}"
          - name: Pull target firmware image
            continue-on-error: true
            run: docker pull "${TO_IMAGE}"
      - id: firmware-images
        shell: bash
        run: |
          cache_needed=false
          while IFS=$'\t' read -r model board version url; do
            [[ "${model}" == "${MODEL}" ]] || continue
            image="${UNIFI_OS_IMAGE}:${model}-${version}"
            expected=$(printf '%s\t%s\t%s\t%s\n' \
              "${model}" "${board}" "${version}" "${url}" |
              sha256sum | cut -d ' ' -f 1)
            actual=
            actual=$(docker image inspect --format \
              '{{ index .Config.Labels "io.github.udm-iptv.catalog-fingerprint" }}' \
              "${image}") || actual=
            if [[ "${actual}" == "${expected}" ]]; then
              docker tag "${image}" "${UNIFI_OS_IMAGE}:${model}-${board}-${version}"
              echo "Using validated ${image}"
            else
              echo "Image ${image} is unavailable or does not match the firmware catalog"
              cache_needed=true
            fi
          done < firmware.tsv
          echo "cache-needed=${cache_needed}" >> "${GITHUB_OUTPUT}"
      - id: firmware-key
        shell: bash
        run: |
          key=$(awk -F '\t' -v model="${MODEL}" '$1 == model' firmware.tsv | sha256sum | cut -d ' ' -f 1)
          echo "key=${key}" >> "${GITHUB_OUTPUT}"
      - id: firmware-cache
        if: steps.firmware-images.outputs.cache-needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/unifi-os/firmware
          key: unifi-os-firmware-${{ runner.os }}-${{ runner.arch }}-${{ matrix.model }}-${{ steps.firmware-key.outputs.key }}
      - if: steps.firmware-images.outputs.cache-needed == 'true'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with: { platforms: arm64 }
      - if: steps.firmware-images.outputs.cache-needed == 'true'
        run: ./build.sh "${MODEL}"
        env:
          UNIFI_OS_CACHE: ${{ runner.temp }}/unifi-os
      - if: steps.firmware-images.outputs.cache-needed == 'true' && steps.firmware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/unifi-os/firmware
          key: ${{ steps.firmware-cache.outputs.cache-primary-key }}
      - run: ./test-install.sh "${MODEL}" udm-iptv_*.deb
      - if: github.event_name == 'workflow_dispatch'
        run: ./publish.sh "${MODEL}"
        env: { MODEL: "${{ matrix.model }}" }
