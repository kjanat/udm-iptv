name: Build
on: pull_request
concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - name: Test Go
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with: { version: latest }
      - name: Check Go vulnerabilities
        run: go tool govulncheck ./...
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: Validate Debian scripts
        run: |
          sh -n packaging/deb/config packaging/deb/preinstall packaging/deb/postinstall packaging/deb/preremove packaging/deb/postremove
          shellcheck packaging/deb/config packaging/deb/preinstall packaging/deb/postinstall packaging/deb/preremove packaging/deb/postremove
      - name: Validate Debian package
        run: |
          package=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          package_name=$(dpkg-deb --field "${package}" Package)
          architecture=$(dpkg-deb --field "${package}" Architecture)
          test "${package_name}" = udm-iptv
          test "${architecture}" = arm64
          control=$(mktemp -d)
          dpkg-deb --control "${package}" "${control}"
          test -x "${control}/config"
          test -x "${control}/preinst"
          test -x "${control}/postinst"
          test -x "${control}/prerm"
          test -x "${control}/postrm"
          test -f "${control}/templates"
          dpkg-deb --contents "${package}" | rg '/data/udm-iptv/bin/udm-iptv$'
          dpkg-deb --contents "${package}" | rg '/usr/share/doc/udm-iptv/copyright$'
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          if-no-files-found: error
          path: |
            dist/**/udm-iptv
            dist/*.deb
            dist/SHA256SUMS
