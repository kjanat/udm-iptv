name: Build
on: pull_request
concurrency:
  group: unifi-os-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - parallel: # Checkout sources and apt install
          - name: Checkout Sources
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with: { path: &WD udm-iptv }
          - name: Setup Dependencies
            run: sudo apt-get install devscripts debhelper build-essential
      - parallel: # Run tests
          - name: Test DHCP Route Hook
            working-directory: *WD
            run: sudo ./tests/udhcpc-hook.sh
          - name: Test UniFi OS image publishing
            working-directory: *WD
            run: ./tests/unifi-os-publish.sh
          - name: Test Bash Completion
            working-directory: *WD
            run: ./tests/bash-completion.sh
          - name: Test installer asset selection
            working-directory: *WD
            run: ./tests/install-assets.sh
          - name: Test Diagnostics
            working-directory: *WD
            run: ./tests/diagnostics.sh
      - name: Build Package
        working-directory: *WD
        run: debuild -uc -us --lintian-opts --profile debian
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          if-no-files-found: error
          path: |
            *.deb
            *.build*
            *.changes
            *.dsc
